<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/default}" lang="en">

<head>
    <title>Farm Map - ADRS</title>
    <link rel="stylesheet" th:href="@{/css/farms-map.css}">
</head>

<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header-row">
            <div class="page-header-info">
                <h2>🗺️ Farm Map</h2>
                <p class="page-subtitle">View all registered farm locations and disease outbreaks across Sri Lanka</p>
            </div>
        </div>

        <!-- Map Filters Bar -->
        <div class="map-filters-bar">
            <!-- Main Toggles Section -->
            <div class="filter-section filter-toggles">
                <span class="section-label">Show:</span>
                <label class="filter-toggle">
                    <input type="checkbox" id="filterFarms" checked>
                    <span class="toggle-content">
                        <span class="toggle-icon">🏠</span>
                        <span class="toggle-text">Farms</span>
                        <span class="toggle-count" id="farmCount">0</span>
                    </span>
                </label>
                <label class="filter-toggle filter-toggle-disease">
                    <input type="checkbox" id="filterDiseases">
                    <span class="toggle-content">
                        <span class="toggle-icon">⚠️</span>
                        <span class="toggle-text">Disease Outbreaks</span>
                        <span class="toggle-count" id="diseaseCount">0</span>
                    </span>
                </label>
            </div>

            <!-- Province Filter (shown when Farms checked) -->
            <div class="filter-section filter-select-group" id="provinceFilterSection">
                <label class="select-label" for="provinceSelect">
                    <span class="label-icon">📍</span>
                    Province
                </label>
                <select id="provinceSelect" class="filter-select">
                    <option value="">All Provinces</option>
                    <!-- Dynamically populated -->
                </select>
            </div>

            <!-- Disease Filters (shown when Disease Outbreaks checked) -->
            <div class="filter-section filter-select-group" id="animalTypeFilterSection" style="display: none;">
                <label class="select-label" for="animalTypeSelect">
                    <span class="label-icon">🐄</span>
                    Animal Type
                </label>
                <select id="animalTypeSelect" class="filter-select">
                    <!-- Dynamically populated -->
                </select>
            </div>

            <div class="filter-section filter-select-group" id="diseaseFilterSection" style="display: none;">
                <label class="select-label" for="diseaseSelect">
                    <span class="label-icon">🦠</span>
                    Disease
                </label>
                <select id="diseaseSelect" class="filter-select">
                    <!-- Dynamically populated -->
                </select>
            </div>
        </div>

        <!-- Map Container -->
        <div class="google-map-container">
            <div id="farmMap" class="google-map"></div>

            <!-- Loading Overlay -->
            <div id="mapLoading" class="map-loading-overlay">
                <div class="spinner"></div>
                <p>Loading map...</p>
            </div>

            <!-- Empty State -->
            <div id="mapEmptyState" class="map-empty-state" style="display: none;">
                <div class="empty-icon">🗺️</div>
                <h3>No Farms with Location Data</h3>
                <p>No farms have GPS coordinates registered yet. Add location data when registering farms.</p>
            </div>
        </div>

        <!-- Map Legend -->
        <div class="map-legend-bar">
            <div class="legend-item">
                <span class="legend-marker farm-marker"></span>
                <span>Farm Only</span>
            </div>
            <div class="legend-item">
                <span class="legend-marker disease-marker"></span>
                <span>Farm with Diseases</span>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <!-- Map Configuration (from server) -->
        <script th:inline="javascript">
            window.mapConfig = {
                apiKey: /*[[${googleMapsApiKey}]]*/ '',
                defaultLat: /*[[${mapDefaultLat}]]*/ 7.8731,
                defaultLng: /*[[${mapDefaultLng}]]*/ 80.7718,
                defaultZoom: /*[[${mapDefaultZoom}]]*/ 7
            };
            window.currentUsername = /*[[${#authentication.name}]]*/ '';
        </script>

        <!-- Google Maps API -->
        <script
            th:src="@{'https://maps.googleapis.com/maps/api/js?key=' + ${googleMapsApiKey} + '&callback=initFarmMap&loading=async'}"
            async defer></script>
        <script th:src="@{/js/farms-map.js}"></script>
    </div>

</body>

</html>
